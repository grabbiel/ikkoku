# Public CI: runs only what needs no private data.
#
# The public verification lane (Tools/verification/lanes/public.json) runs
# WITHOUT --strict, so fixture-gated tests report named skips instead of
# failing. The private-source, maker, app-smoke and studio-scenarios lanes need
# the original installation, the Parallels VM or .local/ fixtures and stay local;
# see Tools/verification/README.md "Continuous integration".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-lane:
    name: Public lane (Engine swift test + Python suites)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      # T-T01: fail early, naming the fix, if a public prerequisite (Xcode,
      # Metal compiler, Swift, python3, .NET SDK) is missing. Optional
      # capabilities are reported but cannot fail this step.
      - name: Prerequisite check (public)
        run: python3 Tools/verification/doctor.py --require public --verbose
      # A cold Engine build can exceed the lane's 600 s check timeout on a
      # hosted runner, so build the tests first; the lane's `swift test`
      # then reuses the build.
      - name: Build Engine tests
        run: swift build --build-tests --package-path Packages/Engine
      - name: Public verification lane (skip-tolerant)
        run: >-
          python3 Tools/verification/run.py
          --manifest Tools/verification/lanes/public.json
          --report .local/verification/reports/ci-public.json
      - name: Upload lane report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-lane-report
          path: .local/verification/reports/
          if-no-files-found: ignore

  app-build:
    name: IkkokuCreator Debug build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain versions
        run: xcodebuild -version
      # Signing is disabled: the hosted runner has no development team
      # identity, and the build only checks that the app compiles and links.
      - name: Build IkkokuCreator (Debug, unsigned)
        run: >-
          xcodebuild -project Ikkoku.xcodeproj -scheme IkkokuCreator
          -configuration Debug -derivedDataPath .local/build
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
          build

  # T-T02: build the Release app from this clean checkout and inspect what it
  # would ship (Tools/verification/inspect_app_bundle.py with the reviewed
  # app-bundle-rules.json). The inspector fails on a missing metallib, catalog
  # or catalog-referenced asset, a Mach-O without arm64, any file that is
  # neither a declared build product nor a git-tracked Assets/ file, and
  # private or original-game content. It never launches the app, so runtime
  # resource lookup outside the checkout is not verified by this job.
  release-package:
    name: IkkokuCreator Release package inspection
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain versions
        run: |
          xcodebuild -version
          python3 --version
      - name: Prerequisite check (app build)
        run: python3 Tools/verification/doctor.py --require app-build --verbose
      # Unsigned for the same reason as the Debug job. ARCHS=arm64: the port
      # targets Apple Silicon, and a default Release build would also compile
      # an x86_64 slice that nothing tests.
      - name: Build IkkokuCreator (Release, unsigned, arm64)
        run: >-
          xcodebuild -project Ikkoku.xcodeproj -scheme IkkokuCreator
          -configuration Release -derivedDataPath .local/build-release
          -destination 'platform=macOS,arch=arm64'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
          build
      # Inspect the app after a zip round trip outside the checkout, the form
      # it would be handed over in, rather than the build folder itself.
      - name: Package the app outside the checkout
        run: |
          ditto -c -k --keepParent .local/build-release/Build/Products/Release/Ikkoku.app "$RUNNER_TEMP/Ikkoku.zip"
          ditto -x -k "$RUNNER_TEMP/Ikkoku.zip" "$RUNNER_TEMP/package"
          ls -l "$RUNNER_TEMP/Ikkoku.zip"
      - name: Inspect the packaged app
        run: >-
          python3 Tools/verification/inspect_app_bundle.py
          "$RUNNER_TEMP/package/Ikkoku.app"
          --report .local/verification/reports/release-bundle.json
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-report
          path: .local/verification/reports/
          if-no-files-found: ignore

  reverse-tools:
    name: Reverse tools (Python suites, pinned requirements)
    # macOS arm64 like the machines that generate the checked-in float32
    # fixtures: numpy float32 results differ in the last bits on x86 Linux,
    # and test_checked_in_fixture_matches_generator compares exactly.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/reverse/requirements.txt
      # The private fixtures (.local) are absent here: the suites skip or
      # early-return those cases by name, as they do on a fresh checkout.
      - name: Install pinned requirements
        run: python -m pip install -r Tools/reverse/requirements.txt
      - name: Tools/reverse unittests
        working-directory: Tools/reverse
        run: python -m unittest discover -p 'test_*.py'
      - name: Tools/reverse/analysis unittests
        working-directory: Tools/reverse/analysis
        run: python -m unittest discover -p 'test_*.py'
